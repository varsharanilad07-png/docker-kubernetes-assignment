apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloud-native-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cloud-native-app

  template:
    metadata:
      labels:
        app: cloud-native-app

    spec:
      containers:
        - name: cloud-native-container
          image: cloud-native-app:1.0
          imagePullPolicy: Never

          ports:
            - containerPort: 5000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"